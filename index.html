<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlumixOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .tag {
            font-family: monospace;
            color: #58a6ff;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        p {
            color: #8b949e;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AlumixOS</h1>
        <div class="tag">/ System Development</div>
         
        <div class="badge">Closed</div>
    </div>
</body>
</html>
